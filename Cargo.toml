[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
repository = "https://github.com/hexodditylabs/Oddity-engine"
authors = ["Hex0ddity Labs"]
publish = false

[workspace.dependencies]
# Bevy 0.20.0 is Oddity's seed: pinned exactly, and we do not follow upstream
# releases. When we start changing engine internals, fork it into the repo
# (e.g. `engine/bevy`) and point this at `path = "engine/bevy"`.
# Editor UI crates add the `bevy_feathers` feature themselves, so games built
# on the runtime crates don't carry the editor's widgets.
bevy = "=0.20.0"
# The headless core uses Bevy's sub-crates directly (same versions as `bevy`),
# so it builds and tests without any rendering code.
bevy_app = "=0.20.0"
bevy_ecs = "=0.20.0"
bevy_reflect = "=0.20.0"
# Must match the winit version Bevy uses (needed for the window icon).
winit = { version = "0.30", default-features = false }
resvg = { version = "0.48", default-features = false }

serde = { version = "1", features = ["derive"] }
# preserve_order: components read back with their fields in declaration
# order, so the Inspector lists Position, Rotation, Scale as Godot does.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
# Asset IDs (`oddity_project::assets`); the same crate Bevy uses for its own.
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.9"
tracing = "0.1"
tempfile = "3"
# For `#[script]` and the other scripting macros.
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
# The MCP SDK (task K6), and the async runtime it runs on.
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "io-std"] }

oddity = { path = "crates/oddity" }
oddity_build = { path = "crates/oddity_build" }
oddity_core = { path = "crates/oddity_core" }
oddity_icons = { path = "crates/oddity_icons" }
oddity_level = { path = "crates/oddity_level" }
oddity_mcp = { path = "crates/oddity_mcp" }
oddity_plugin_api = { path = "crates/oddity_plugin_api" }
oddity_project = { path = "crates/oddity_project" }
oddity_script = { path = "crates/oddity_script" }
oddity_script_macros = { path = "crates/oddity_script_macros" }
oddity_widgets = { path = "crates/oddity_widgets" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"

# Bevy's recommended dev profile: our code builds fast, dependencies run fast.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 684" width="760" height="684" role="img" aria-label="Scripts read now; writes and signals land right after" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
svg{--ink:#1f2328;--quiet:#59636e;--edge:#8c959f;--rule:#d0d7de;--accent:#ff2d55;--bg:#ffffff;
font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme:dark){svg{--ink:#e6edf3;--quiet:#9198a1;--edge:#6e7681;--rule:#30363d;--bg:#0d1117}}
.bg{fill:var(--bg)}
.ink{fill:var(--ink)}.quiet{fill:var(--quiet)}.acc{fill:var(--accent)}.b{font-weight:600}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.main{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.dash{fill:none;stroke:var(--edge);stroke-width:1.25;stroke-dasharray:5 4}
.wire{fill:none;stroke:var(--edge);stroke-width:1.25}
.rule{stroke:var(--rule)}
.arrowhead{fill:var(--edge)}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs>
<rect class="bg" width="760" height="684" rx="12"/>
<text x="24" y="34" class="ink b" font-size="15">Scripts read now; writes and signals land right after</text>
<text x="24" y="54" class="quiet" font-size="11.5">One frame of the Player and Enemy example</text>
<g class="wire"><path d="M232 104H264" marker-end="url(#arrow)"/><path d="M378 132V164" marker-end="url(#arrow)"/><path d="M622 132V164" marker-end="url(#arrow)"/><path d="M378 252V284" marker-end="url(#arrow)"/><path d="M622 252V284" marker-end="url(#arrow)"/><path d="M622 356V388" marker-end="url(#arrow)"/><path d="M622 460V492" marker-end="url(#arrow)"/><path d="M378 356V604" marker-end="url(#arrow)"/><path d="M622 564V604" marker-end="url(#arrow)"/></g>
<path d="M128 236V604" class="dash" marker-end="url(#arrow)"/>
<text x="136" y="424" class="quiet" font-size="11.5">the tree is a view</text>
<text x="136" y="440" class="quiet" font-size="11.5">of these entities</text>
<rect x="24" y="76" width="208" height="160" rx="8" class="box"/>
<text x="40" y="100" class="ink b">Hierarchy</text>
<text x="40" y="124" class="ink" font-size="11.5">Level</text>
<text x="56" y="144" class="ink" font-size="11.5">Player · Player script</text>
<text x="56" y="164" class="ink" font-size="11.5">Enemy · Enemy script</text>
<line x1="40" x2="216" y1="180" y2="180" class="rule"/>
<text x="40" y="200" class="quiet" font-size="11.5">Enemy is connected to</text>
<text x="40" y="216" class="quiet" font-size="11.5">Player's Died signal</text>
<rect x="264" y="76" width="472" height="56" rx="8" class="box"/>
<text x="280" y="100" class="ink b">Player.update(ctx, dt)</text>
<text x="280" y="118" class="ink" font-size="11.5">The dispatcher runs each script in tree order</text>
<rect x="264" y="164" width="228" height="88" rx="8" class="box"/>
<text x="280" y="188" class="ink b">ctx.get_node("../Enemy")</text>
<text x="280" y="206" class="ink" font-size="11.5">Returns a NodeRef handle</text>
<text x="280" y="222" class="ink" font-size="11.5">Reads happen right away</text>
<text x="280" y="238" class="ink" font-size="11.5">Writes join the queue</text>
<rect x="508" y="164" width="228" height="88" rx="8" class="box"/>
<text x="524" y="188" class="ink b">ctx.emit(Died)</text>
<text x="524" y="206" class="ink" font-size="11.5">Triggers the Died signal</text>
<text x="524" y="222" class="ink" font-size="11.5">on the Player entity</text>
<text x="524" y="238" class="ink" font-size="11.5">Queued, like writes</text>
<rect x="264" y="284" width="228" height="72" rx="8" class="box"/>
<text x="280" y="308" class="ink b">Write queue applied</text>
<text x="280" y="326" class="ink" font-size="11.5">Right after the script</text>
<text x="280" y="342" class="ink" font-size="11.5">finishes, in order</text>
<rect x="508" y="284" width="228" height="72" rx="8" class="box"/>
<text x="524" y="308" class="ink b">Observer on Player</text>
<text x="524" y="326" class="ink" font-size="11.5">Made at level load from</text>
<text x="524" y="342" class="ink" font-size="11.5">the saved connection</text>
<rect x="508" y="388" width="228" height="72" rx="8" class="box"/>
<text x="524" y="412" class="ink b">Handler table</text>
<text x="524" y="430" class="ink" font-size="11.5">"on_player_died" maps to</text>
<text x="524" y="446" class="ink" font-size="11.5">a method on Enemy</text>
<rect x="508" y="492" width="228" height="72" rx="8" class="main"/>
<text x="524" y="516" class="ink b">Enemy.on_player_died</text>
<text x="524" y="534" class="ink" font-size="11.5">Runs with its own ctx</text>
<text x="524" y="550" class="ink" font-size="11.5">and the Died value</text>
<rect x="24" y="604" width="712" height="56" rx="8" class="box"/>
<text x="40" y="628" class="ink b">Bevy World</text>
<text x="40" y="646" class="ink" font-size="11.5">Components, hierarchy and observers: plain Bevy underneath</text>
</svg>

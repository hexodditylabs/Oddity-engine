<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 418" width="760" height="418" role="img" aria-label="One frame: scripts one at a time, systems in parallel" font-size="13">
<style>
svg{--ink:#1f2328;--quiet:#59636e;--edge:#8c959f;--rule:#d0d7de;--accent:#ff2d55;--bg:#ffffff;
font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme:dark){svg{--ink:#e6edf3;--quiet:#9198a1;--edge:#6e7681;--rule:#30363d;--bg:#0d1117}}
.bg{fill:var(--bg)}
.ink{fill:var(--ink)}.quiet{fill:var(--quiet)}.acc{fill:var(--accent)}.b{font-weight:600}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.main{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.dash{fill:none;stroke:var(--edge);stroke-width:1.25;stroke-dasharray:5 4}
.wire{fill:none;stroke:var(--edge);stroke-width:1.25}
.rule{stroke:var(--rule)}
.arrowhead{fill:var(--edge)}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs>
<rect class="bg" width="760" height="418" rx="12"/>
<text x="24" y="34" class="ink b" font-size="15">One frame: scripts one at a time, systems in parallel</text>
<text x="24" y="54" class="quiet" font-size="11.5">What the runner does each frame, and inside a single script call.</text>
<rect x="24" y="76" width="340" height="74" rx="8" class="box"/>
<text x="40" y="100" class="ink b">FixedUpdate  (0 or more times)</text>
<text x="40" y="122" class="ink" font-size="11.5">_onphysicsprocess, in Hierarchy order</text>
<text x="40" y="140" class="ink" font-size="11.5">Physics step (Rapier), then _oncollision… / _ontrigger…</text>
<rect x="24" y="184" width="340" height="92" rx="8" class="box"/>
<text x="40" y="208" class="ink b">Update</text>
<text x="40" y="230" class="ink" font-size="11.5">_onenable + _onready for scripts that are new</text>
<text x="40" y="248" class="ink" font-size="11.5">_onprocess, in Hierarchy order</text>
<text x="40" y="266" class="ink" font-size="11.5">Your Bevy systems, in parallel as usual</text>
<rect x="24" y="310" width="340" height="74" rx="8" class="box"/>
<text x="40" y="334" class="ink b">PostUpdate</text>
<text x="40" y="356" class="ink" font-size="11.5">_onlateprocess (cameras follow here)</text>
<text x="40" y="374" class="ink" font-size="11.5">Transforms propagate, then the frame renders</text>
<g class="wire"><path d="M194 168V180" marker-end="url(#arrow)"/><path d="M194 294V306" marker-end="url(#arrow)"/></g>
<rect x="420" y="76" width="316" height="318" rx="8" class="main"/>
<text x="436" y="100" class="ink b">Inside one script call</text>
<text x="436" y="126" class="ink" font-size="11.5">1. Take Player out of its component</text>
<text x="452" y="142" class="quiet" font-size="11.5">(the default stays in place meanwhile)</text>
<text x="436" y="168" class="ink" font-size="11.5">2. Call _onprocess(&amp;mut self, ctx, delta)</text>
<text x="452" y="186" class="quiet" font-size="11.5">ctx.call::&lt;Health&gt;(enemy, ..) runs now</text>
<text x="452" y="202" class="quiet" font-size="11.5">event.invoke(ctx) runs listeners now</text>
<text x="452" y="218" class="quiet" font-size="11.5">a call back into Player is queued</text>
<text x="436" y="244" class="ink" font-size="11.5">3. Put Player back</text>
<text x="436" y="270" class="ink" font-size="11.5">4. Run anything queued in step 2</text>
<text x="436" y="296" class="ink" font-size="11.5">5. #[on] handlers for signals it emitted</text>
<text x="436" y="322" class="ink" font-size="11.5">6. Despawn it if it called ctx.destroy()</text>
<line x1="436" x2="720" y1="342" y2="342" class="rule"/>
<text x="436" y="364" class="ink" font-size="11.5">Every change is visible to the very</text>
<text x="436" y="380" class="ink" font-size="11.5">next line of code, as in Unity.</text>
<path d="M364 236H416" class="wire" marker-end="url(#arrow)"/>
</svg>

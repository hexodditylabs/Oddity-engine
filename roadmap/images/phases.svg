<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="Phases 0 to 2 are built; the editor is usable after Phase 3" font-size="13">
<style>
svg{--ink:#1f2328;--quiet:#59636e;--edge:#8c959f;--rule:#d0d7de;--accent:#ff2d55;--bg:#ffffff;
font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme:dark){svg{--ink:#e6edf3;--quiet:#9198a1;--edge:#6e7681;--rule:#30363d;--bg:#0d1117}}
.bg{fill:var(--bg)}
.ink{fill:var(--ink)}.quiet{fill:var(--quiet)}.acc{fill:var(--accent)}.b{font-weight:600}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.main{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.dash{fill:none;stroke:var(--edge);stroke-width:1.25;stroke-dasharray:5 4}
.wire{fill:none;stroke:var(--edge);stroke-width:1.25}
.rule{stroke:var(--rule)}
.arrowhead{fill:var(--edge)}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs>
<rect class="bg" width="760" height="470" rx="12"/>
<text x="24" y="34" class="ink b" font-size="15">Phases 0 to 2 are built; the editor is usable after Phase 3</text>
<text x="24" y="54" class="quiet" font-size="11.5">Each phase ends in something that runs. MCP can move earlier at any point.</text>
<g class="wire"><path d="M190 157H204" marker-end="url(#arrow)"/><path d="M372 157H386" marker-end="url(#arrow)"/><path d="M554 157H568" marker-end="url(#arrow)"/><path d="M190 359H204" marker-end="url(#arrow)"/><path d="M372 359H386" marker-end="url(#arrow)"/><path d="M554 359H568" marker-end="url(#arrow)"/><path d="M653 242V258H107V270" marker-end="url(#arrow)"/></g>
<rect x="24" y="72" width="166" height="170" rx="8" class="main"/>
<text x="38" y="96" class="ink b">0 · Foundations</text>
<text x="176" y="96" text-anchor="end" class="acc b">✓</text>
<text x="38" y="118" class="ink" font-size="11.5">Workspace on Bevy 0.20</text>
<text x="38" y="134" class="ink" font-size="11.5">CI, lints, fast builds</text>
<text x="38" y="150" class="ink" font-size="11.5">Icons, theme, fonts</text>
<line x1="38" x2="176" y1="170" y2="170" class="rule"/>
<text x="38" y="192" class="quiet b" font-size="11.5">Done when</text>
<text x="38" y="208" class="ink" font-size="11.5">Editor window opens,</text>
<text x="38" y="224" class="ink" font-size="11.5">CI is green</text>
<rect x="206" y="72" width="166" height="170" rx="8" class="main"/>
<text x="220" y="96" class="ink b">1 · Core</text>
<text x="358" y="96" text-anchor="end" class="acc b">✓</text>
<text x="220" y="118" class="ink" font-size="11.5">Commands, undo/redo</text>
<text x="220" y="134" class="ink" font-size="11.5">Selection, level root</text>
<text x="220" y="150" class="ink" font-size="11.5">Projects, headless mode</text>
<line x1="220" x2="358" y1="170" y2="170" class="rule"/>
<text x="220" y="192" class="quiet b" font-size="11.5">Done when</text>
<text x="220" y="208" class="ink" font-size="11.5">Commands run headless,</text>
<text x="220" y="224" class="ink" font-size="11.5">with undo</text>
<rect x="388" y="72" width="166" height="170" rx="8" class="main"/>
<text x="402" y="96" class="ink b">2 · Widgets, shell</text>
<text x="540" y="96" text-anchor="end" class="acc b">✓</text>
<text x="402" y="118" class="ink" font-size="11.5">Godot 4.7 look</text>
<text x="402" y="134" class="ink" font-size="11.5">Docks, tree, filters</text>
<text x="402" y="150" class="ink" font-size="11.5">Hierarchy, Inspector</text>
<line x1="402" x2="540" y1="170" y2="170" class="rule"/>
<text x="402" y="192" class="quiet b" font-size="11.5">Done when</text>
<text x="402" y="208" class="ink" font-size="11.5">The layout looks</text>
<text x="402" y="224" class="ink" font-size="11.5">like Godot's</text>
<rect x="570" y="72" width="166" height="170" rx="8" class="box"/>
<text x="584" y="96" class="ink b">3 · Editing</text>
<text x="722" y="96" text-anchor="end" class="quiet b" font-size="11.5">next</text>
<text x="584" y="118" class="ink" font-size="11.5">Viewport, gizmos</text>
<text x="584" y="134" class="ink" font-size="11.5">Levels, prefabs, Play</text>
<text x="584" y="150" class="ink" font-size="11.5">Scripting, physics</text>
<line x1="584" x2="722" y1="170" y2="170" class="rule"/>
<text x="584" y="192" class="quiet b" font-size="11.5">Done when</text>
<text x="584" y="208" class="ink" font-size="11.5">Make, save and play</text>
<text x="584" y="224" class="ink" font-size="11.5">a level</text>
<rect x="24" y="274" width="166" height="170" rx="8" class="dash"/>
<text x="38" y="298" class="ink b">4 · Game features</text>
<text x="38" y="320" class="ink" font-size="11.5">Assets, animation, UI</text>
<text x="38" y="336" class="ink" font-size="11.5">Saving, export, Steam</text>
<text x="38" y="352" class="ink" font-size="11.5">2D, navigation</text>
<line x1="38" x2="176" y1="372" y2="372" class="rule"/>
<text x="38" y="394" class="quiet b" font-size="11.5">Done when</text>
<text x="38" y="410" class="ink" font-size="11.5">A small game ships</text>
<text x="38" y="426" class="ink" font-size="11.5">on Steam</text>
<rect x="206" y="274" width="166" height="170" rx="8" class="dash"/>
<text x="220" y="298" class="ink b">5 · Multiplayer</text>
<text x="220" y="320" class="ink" font-size="11.5">Host and join, sync</text>
<text x="220" y="336" class="ink" font-size="11.5">RPCs, QUIC, Steam</text>
<text x="220" y="352" class="ink" font-size="11.5">Play with N players</text>
<line x1="220" x2="358" y1="372" y2="372" class="rule"/>
<text x="220" y="394" class="quiet b" font-size="11.5">Done when</text>
<text x="220" y="410" class="ink" font-size="11.5">Two players play co-op</text>
<text x="220" y="426" class="ink" font-size="11.5">over Steam</text>
<rect x="388" y="274" width="166" height="170" rx="8" class="dash"/>
<text x="402" y="298" class="ink b">6 · CLI, MCP, plugins</text>
<text x="402" y="320" class="ink" font-size="11.5">Editor CLI</text>
<text x="402" y="336" class="ink" font-size="11.5">MCP over commands</text>
<text x="402" y="352" class="ink" font-size="11.5">Plugin API v1</text>
<line x1="402" x2="540" y1="372" y2="372" class="rule"/>
<text x="402" y="394" class="quiet b" font-size="11.5">Done when</text>
<text x="402" y="410" class="ink" font-size="11.5">An agent and a plugin</text>
<text x="402" y="426" class="ink" font-size="11.5">edit a level</text>
<rect x="570" y="274" width="166" height="170" rx="8" class="dash"/>
<text x="584" y="298" class="ink b">7 · Hub</text>
<text x="584" y="320" class="ink" font-size="11.5">Launch handoff</text>
<text x="584" y="336" class="ink" font-size="11.5">Installs and versions</text>
<text x="584" y="352" class="ink" font-size="11.5">Projects, templates</text>
<line x1="584" x2="722" y1="372" y2="372" class="rule"/>
<text x="584" y="394" class="quiet b" font-size="11.5">Done when</text>
<text x="584" y="410" class="ink" font-size="11.5">Two versions, a project</text>
<text x="584" y="426" class="ink" font-size="11.5">open in each</text>
</svg>

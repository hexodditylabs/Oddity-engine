<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="Phases 0 to 2 are built; the editor is usable after Phase 3" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
svg{--ink:#1f2328;--quiet:#59636e;--edge:#8c959f;--rule:#d0d7de;--accent:#ff2d55;--bg:#ffffff;
font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme:dark){svg{--ink:#e6edf3;--quiet:#9198a1;--edge:#6e7681;--rule:#30363d;--bg:#0d1117}}
.bg{fill:var(--bg)}
.ink{fill:var(--ink)}.quiet{fill:var(--quiet)}.acc{fill:var(--accent)}.b{font-weight:600}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.main{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.dash{fill:none;stroke:var(--edge);stroke-width:1.25;stroke-dasharray:5 4}
.wire{fill:none;stroke:var(--edge);stroke-width:1.25}
.rule{stroke:var(--rule)}
.arrowhead{fill:var(--edge)}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs>
<rect class="bg" width="760" height="470" rx="12"/>
<text x="24" y="34" class="ink b" font-size="15">Phases 0 to 2 are built; the editor is usable after Phase 3</text>
<text x="24" y="54" class="quiet" font-size="11.5">Each phase ends in something that runs. MCP can move up to follow Phase 1.</text>
<g class="wire"><path d="M232 155H264" marker-end="url(#arrow)"/><path d="M472 155H504" marker-end="url(#arrow)"/><path d="M608 238V258H128V278" marker-end="url(#arrow)"/><path d="M232 361H264" marker-end="url(#arrow)"/><path d="M472 361H504" marker-end="url(#arrow)"/></g>
<rect x="24" y="72" width="208" height="166" rx="8" class="main"/>
<text x="40" y="96" class="ink b">0 · Foundations</text>
<text x="216" y="96" text-anchor="end" class="acc b" font-size="11.5">✓ built</text>
<text x="40" y="118" class="ink" font-size="11.5">Cargo workspace on Bevy 0.20</text>
<text x="40" y="134" class="ink" font-size="11.5">Fast compiles, CI, lints</text>
<text x="40" y="150" class="ink" font-size="11.5">Icons, Godot theme, fonts</text>
<line x1="40" x2="216" y1="170" y2="170" class="rule"/>
<text x="40" y="192" class="quiet b" font-size="11.5">Done when</text>
<text x="40" y="208" class="ink" font-size="11.5">Empty editor window opens</text>
<text x="40" y="224" class="ink" font-size="11.5">and CI is green</text>
<rect x="264" y="72" width="208" height="166" rx="8" class="main"/>
<text x="280" y="96" class="ink b">1 · Core</text>
<text x="456" y="96" text-anchor="end" class="acc b" font-size="11.5">✓ built</text>
<text x="280" y="118" class="ink" font-size="11.5">Command registry, undo/redo</text>
<text x="280" y="134" class="ink" font-size="11.5">Selection, level root</text>
<text x="280" y="150" class="ink" font-size="11.5">Project file, headless mode</text>
<line x1="280" x2="456" y1="170" y2="170" class="rule"/>
<text x="280" y="192" class="quiet b" font-size="11.5">Done when</text>
<text x="280" y="208" class="ink" font-size="11.5">Commands run headless in</text>
<text x="280" y="224" class="ink" font-size="11.5">tests, with undo</text>
<rect x="504" y="72" width="208" height="166" rx="8" class="main"/>
<text x="520" y="96" class="ink b">2 · Widgets and shell</text>
<text x="696" y="96" text-anchor="end" class="acc b" font-size="11.5">✓ built</text>
<text x="520" y="118" class="ink" font-size="11.5">Godot 4.7 look and icons</text>
<text x="520" y="134" class="ink" font-size="11.5">Docks, splits, tree, filters</text>
<text x="520" y="150" class="ink" font-size="11.5">Hierarchy, Inspector, History</text>
<line x1="520" x2="696" y1="170" y2="170" class="rule"/>
<text x="520" y="192" class="quiet b" font-size="11.5">Done when</text>
<text x="520" y="208" class="ink" font-size="11.5">The layout looks like</text>
<text x="520" y="224" class="ink" font-size="11.5">Godot's</text>
<rect x="24" y="278" width="208" height="166" rx="8" class="box"/>
<text x="40" y="302" class="ink b">3 · Editing</text>
<text x="216" y="302" text-anchor="end" class="quiet b" font-size="11.5">next</text>
<text x="40" y="324" class="ink" font-size="11.5">Editable inspector, 3D view</text>
<text x="40" y="340" class="ink" font-size="11.5">Levels, prefab mode, play</text>
<text x="40" y="356" class="ink" font-size="11.5">Scripts, get_node, signals</text>
<line x1="40" x2="216" y1="376" y2="376" class="rule"/>
<text x="40" y="398" class="quiet b" font-size="11.5">Done when</text>
<text x="40" y="414" class="ink" font-size="11.5">Make, save, reopen and</text>
<text x="40" y="430" class="ink" font-size="11.5">play a level; edit a prefab</text>
<rect x="264" y="278" width="208" height="166" rx="8" class="dash"/>
<text x="280" y="302" class="ink b">4 · CLI, MCP, plugins</text>
<text x="280" y="324" class="ink" font-size="11.5">Editor CLI: run, build</text>
<text x="280" y="340" class="ink" font-size="11.5">MCP server over commands</text>
<text x="280" y="356" class="ink" font-size="11.5">EditorPlugin API v1</text>
<line x1="280" x2="456" y1="376" y2="376" class="rule"/>
<text x="280" y="398" class="quiet b" font-size="11.5">Done when</text>
<text x="280" y="414" class="ink" font-size="11.5">An agent and a sample</text>
<text x="280" y="430" class="ink" font-size="11.5">plugin both edit a level</text>
<rect x="504" y="278" width="208" height="166" rx="8" class="dash"/>
<text x="520" y="302" class="ink b">5 · Hub</text>
<text x="520" y="324" class="ink" font-size="11.5">Launch handoff contract</text>
<text x="520" y="340" class="ink" font-size="11.5">Hub CLI: new, open, install</text>
<text x="520" y="356" class="ink" font-size="11.5">Hub UI, version manifest</text>
<line x1="520" x2="696" y1="376" y2="376" class="rule"/>
<text x="520" y="398" class="quiet b" font-size="11.5">Done when</text>
<text x="520" y="414" class="ink" font-size="11.5">Hub installs two versions</text>
<text x="520" y="430" class="ink" font-size="11.5">and opens each project</text>
</svg>

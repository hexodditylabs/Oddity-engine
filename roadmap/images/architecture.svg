<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 508" width="760" height="508" role="img" aria-label="Every way in goes through one command layer" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
svg{--ink:#1f2328;--quiet:#59636e;--edge:#8c959f;--rule:#d0d7de;--accent:#ff2d55;--bg:#ffffff;
font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme:dark){svg{--ink:#e6edf3;--quiet:#9198a1;--edge:#6e7681;--rule:#30363d;--bg:#0d1117}}
.bg{fill:var(--bg)}
.ink{fill:var(--ink)}.quiet{fill:var(--quiet)}.acc{fill:var(--accent)}.b{font-weight:600}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.main{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.dash{fill:none;stroke:var(--edge);stroke-width:1.25;stroke-dasharray:5 4}
.wire{fill:none;stroke:var(--edge);stroke-width:1.25}
.rule{stroke:var(--rule)}
.arrowhead{fill:var(--edge)}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs>
<rect class="bg" width="760" height="508" rx="12"/>
<text x="24" y="34" class="ink b" font-size="15">Every way in goes through one command layer</text>
<g class="wire"><path d="M356 92H404" marker-end="url(#arrow)"/><path d="M190 128V180" marker-end="url(#arrow)"/><path d="M570 128V180" marker-end="url(#arrow)"/><path d="M119 292V324" marker-end="url(#arrow)"/><path d="M293 292V324" marker-end="url(#arrow)"/><path d="M467 292V324" marker-end="url(#arrow)"/><path d="M641 292V324" marker-end="url(#arrow)"/><path d="M380 380V412" marker-end="url(#arrow)"/></g>
<text x="198" y="158" class="quiet" font-size="11.5">launch handoff</text>
<text x="578" y="158" class="quiet" font-size="11.5">opens</text>
<rect x="24" y="56" width="332" height="72" rx="8" class="box"/>
<text x="40" y="80" class="ink b">oddity-hub</text>
<text x="40" y="98" class="ink" font-size="11.5">Projects, installs, modules, CLI</text>
<text x="40" y="114" class="ink" font-size="11.5">Reads each project's version pin</text>
<rect x="404" y="56" width="332" height="72" rx="8" class="box"/>
<text x="420" y="80" class="ink b">Project folder</text>
<text x="420" y="98" class="ink" font-size="11.5">oddity.toml pins editor + Bevy</text>
<text x="420" y="114" class="ink" font-size="11.5">Cargo game code, levels, prefabs, assets</text>
<rect x="24" y="180" width="712" height="304" rx="8" class="box"/>
<text x="40" y="204" class="ink b">oddity-editor</text>
<text x="150" y="204" class="quiet" font-size="11.5">one install per editor version</text>
<rect x="40" y="220" width="158" height="72" rx="8" class="box"/>
<text x="56" y="244" class="ink b">Editor UI</text>
<text x="56" y="262" class="ink" font-size="11.5">docks, inspector,</text>
<text x="56" y="278" class="ink" font-size="11.5">viewport, shortcuts</text>
<rect x="214" y="220" width="158" height="72" rx="8" class="box"/>
<text x="230" y="244" class="ink b">Editor CLI</text>
<text x="230" y="262" class="ink" font-size="11.5">run, build, plugin</text>
<text x="230" y="278" class="ink" font-size="11.5">no window needed</text>
<rect x="388" y="220" width="158" height="72" rx="8" class="box"/>
<text x="404" y="244" class="ink b">MCP server</text>
<text x="404" y="262" class="ink" font-size="11.5">tools = commands</text>
<text x="404" y="278" class="ink" font-size="11.5">stdio or HTTP</text>
<rect x="562" y="220" width="158" height="72" rx="8" class="box"/>
<text x="578" y="244" class="ink b">Plugins</text>
<text x="578" y="262" class="ink" font-size="11.5">add docks, menus</text>
<text x="578" y="278" class="ink" font-size="11.5">and new commands</text>
<rect x="40" y="324" width="680" height="56" rx="8" class="main"/>
<text x="56" y="348" class="ink b">Command layer</text>
<text x="164" y="348" class="quiet" font-size="11.5">oddity_core</text>
<text x="56" y="364" class="ink" font-size="11.5">Every action is a command: undo/redo, scripting, AI control, works headless</text>
<rect x="40" y="412" width="680" height="56" rx="8" class="box"/>
<text x="56" y="436" class="ink b">Bevy World</text>
<text x="56" y="454" class="ink" font-size="11.5">Entities and components, inspected and saved through bevy_reflect</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="A level holds instances; a prefab is edited on its own" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
svg{--ink:#1f2328;--quiet:#59636e;--edge:#8c959f;--rule:#d0d7de;--accent:#ff2d55;--bg:#ffffff;
font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme:dark){svg{--ink:#e6edf3;--quiet:#9198a1;--edge:#6e7681;--rule:#30363d;--bg:#0d1117}}
.bg{fill:var(--bg)}
.ink{fill:var(--ink)}.quiet{fill:var(--quiet)}.acc{fill:var(--accent)}.b{font-weight:600}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.main{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.dash{fill:none;stroke:var(--edge);stroke-width:1.25;stroke-dasharray:5 4}
.wire{fill:none;stroke:var(--edge);stroke-width:1.25}
.rule{stroke:var(--rule)}
.arrowhead{fill:var(--edge)}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs>
<rect class="bg" width="760" height="400" rx="12"/>
<text x="24" y="34" class="ink b" font-size="15">A level holds instances; a prefab is edited on its own</text>
<text x="24" y="54" class="quiet" font-size="11.5">Unity's model, Unreal-style isolated editing. Both files are BSN underneath.</text>
<rect x="24" y="76" width="320" height="300" rx="8" class="box"/>
<text x="40" y="100" class="ink b">main.level</text>
<text x="128" y="100" class="quiet" font-size="11.5">the world you play</text>
<text x="40" y="128" class="ink" font-size="11.5">Camera, Sun, Environment</text>
<rect x="40" y="144" width="288" height="96" rx="8" class="main"/>
<text x="56" y="168" class="ink b">Goblin</text>
<text x="56" y="186" class="ink" font-size="11.5">instance of enemy.prefab</text>
<text x="56" y="202" class="ink" font-size="11.5">health 30 · overridden, shown in bold</text>
<text x="56" y="218" class="ink" font-size="11.5">speed 4 · from the prefab</text>
<rect x="40" y="256" width="288" height="56" rx="8" class="box"/>
<text x="56" y="280" class="ink b">Goblin2</text>
<text x="56" y="298" class="ink" font-size="11.5">instance, no overrides: follows the prefab</text>
<text x="40" y="340" class="ink" font-size="11.5">Edited in the main viewport.</text>
<text x="40" y="356" class="ink" font-size="11.5">Play runs [editor] main_level.</text>
<rect x="416" y="76" width="320" height="236" rx="8" class="box"/>
<text x="432" y="100" class="ink b">enemy.prefab</text>
<text x="530" y="100" class="quiet" font-size="11.5">a reusable object</text>
<text x="432" y="128" class="ink" font-size="11.5">Enemy</text>
<text x="448" y="146" class="ink" font-size="11.5">Body · Collision · HealthBar</text>
<text x="432" y="170" class="ink" font-size="11.5">health 20 · speed 4</text>
<line x1="432" x2="720" y1="188" y2="188" class="rule"/>
<text x="432" y="210" class="quiet" font-size="11.5">Double-click opens Prefab mode: its own</text>
<text x="432" y="226" class="quiet" font-size="11.5">tab, an empty world with only the prefab,</text>
<text x="432" y="242" class="quiet" font-size="11.5">and a breadcrumb  main ▸ Enemy.</text>
<text x="432" y="266" class="ink" font-size="11.5">Saving updates every instance that</text>
<text x="432" y="282" class="ink" font-size="11.5">hasn't overridden the value.</text>
<g class="wire"><path d="M328 176H412" marker-end="url(#arrow)"/><path d="M416 232H348" marker-end="url(#arrow)"/></g>
<text x="380" y="168" text-anchor="middle" class="acc b" font-size="11.5">Apply</text>
<text x="380" y="250" text-anchor="middle" class="quiet" font-size="11.5">spawns</text>
<rect x="416" y="328" width="320" height="48" rx="8" class="box"/>
<text x="432" y="352" class="ink b">Revert</text>
<text x="432" y="370" class="ink" font-size="11.5">on an instance: the prefab's value returns</text>
</svg>
